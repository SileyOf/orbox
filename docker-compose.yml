# 数据库由你自行部署，这里只有应用本身。配置写在同目录的 .env（参考 .env.example）。
services:
  orbox:
    build: .
    image: orbox:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # 运行日志同时写入 /app/logs/orbox.log（5MB 轮转一次）；后台"日志"页面也能直接看
      LOG_DIR: /app/logs
    volumes:
      - orbox-logs:/app/logs
    ports:
      - "127.0.0.1:8787:8787"
    # 数据库和 Orbox 在同一台机器时，DB_HOST 填 host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  orbox-logs:
