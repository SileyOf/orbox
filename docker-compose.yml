# 数据库由你自行部署，这里只有应用本身。
# 配置有两种方式：启动后在网页的安装向导里填；或者写在同目录的 .env（参考 .env.example），.env 优先。
services:
  orbox:
    build: .
    image: orbox:latest
    restart: unless-stopped
    # .env 里可以不写数据库配置（文件本身要存在，可以是空文件）：没有数据库配置时，首次打开网页会进入安装向导
    env_file: .env
    environment:
      # 运行日志同时写入 /app/logs/orbox.log（5MB 轮转一次）；后台"日志"页面也能直接看
      LOG_DIR: /app/logs
    volumes:
      # 安装向导保存的配置和密钥在这里，务必保留
      - orbox-data:/app/data
      - orbox-logs:/app/logs
    ports:
      - "127.0.0.1:8787:8787"
    # 数据库和 Orbox 在同一台机器时，DB_HOST 填 host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  orbox-data:
  orbox-logs:
